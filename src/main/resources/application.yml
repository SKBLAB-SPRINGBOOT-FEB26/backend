#file: noinspection SpringBootApplicationYaml

server:
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: backend
  config:
    import: optional:file:.env[.properties]
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
#      password: ${REDIS_PASS}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nexusledger}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/liquibase/db.changelog-master.yaml
    default-schema: public
    contexts: dev

logging:
  level:
    org.springframework.security: WARN

jwt:
  expiry: 300
  refresh-expiry: 604800

vault:
  uri: ${VAULT_URI:http://127.0.0.1:8200}
  token: ${VAULT_TOKEN:root}
  kv-path: ${VAULT_KV_PATH:secret/backend/jwt}